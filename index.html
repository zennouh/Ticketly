<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- <link rel="stylesheet" href="src/output.css"> -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="js/index.js" defer></script>

    <title>Ticketly</title>
  </head>

  <body>
    <main class="py-10 bg-[#151932]">
      <div class="main-content">
        <div class="step-section">
          <div class="step-number text-white text-center text-1xl">
            Step <span>1</span>/4
          </div>
          <div class="steps my-5 px-10 flex justify-between">
            <div class="step rounded-full h-2 w-[23%] bg-red-800"></div>
            <div class="step rounded-full h-2 w-[23%] bg-[#D9D9D9]"></div>
            <div class="step rounded-full h-2 w-[23%] bg-[#D9D9D9]"></div>
            <div class="step rounded-full h-2 w-[23%] bg-[#D9D9D9]"></div>
          </div>
        </div>

        <div class="contents">
          <div
            id="content-one"
            class="content-one h-fit grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4"
          >
            <div class="step-name text-3xl text-center text-white bold">
              Choix de l’événement
            </div>
          </div>
          <div class="content-two hidden">
            <div class="step-name text-3xl text-center text-white bold">
              Sélection des billets
            </div>
            <div class="data-card w-50 h-100 mx-5 bg-black/75">

            </div>
          </div>
          <div class="content-tree"></div>
          <div class="content-four"></div>
        </div>
      </div>
      <div
        class="btns w-full h-fit px-7 py-5 my-5 mx-2 rounded-2xl flex justify-between fixed items-end bottom-0 left-0 bg-black/75"
      >
        <div class="btn-prev bg-white rounded-2xl px-6.5 py-3">Prev</div>
        <div class="btn-next bg-red-500 rounded-2xl px-6.5 py-3">Suivant</div>
      </div>
    </main>
  </body>
</html>
