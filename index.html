<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- <link rel="stylesheet" href="src/output.css"> -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Ticketly</title>
  </head>
  <body>
    <main class="py-10 bg-[#151932] h-dvh">
      <div class="stepNumber text-white text-center text-1xl">
        Step <span>1</span>/4
      </div>
      <div class="steps my-5 px-10 flex justify-between">
        <div class="step rounded-full h-2 w-[23%] bg-red-800"></div>
        <div class="step rounded-full h-2 w-[23%] bg-[#D9D9D9]"></div>
        <div class="step rounded-full h-2 w-[23%] bg-[#D9D9D9]"></div>
        <div class="step rounded-full h-2 w-[23%] bg-[#D9D9D9]"></div>
      </div>
      <div class="step-name text-3xl text-center text-white bold">
        Choix de l’événement
      </div>

      <div class="contents">
        <div class="content-one">
          <div class="item m-5 bg-black/54 h-fit">
            <div class="bgimg grid items-end">
              <img
                src="assets/hallowen.jpg"
                class="w-full h-auto row-[1/2] col-[1/2]"
                alt="Hallowen"
              />
              <div
                class="img-info m-2 row-[1/2] col-[1/2] flex justify-between"
              >
                <div class="reset bg-red-700 rounded-full px-3 py-2">
                  reset: 15
                </div>
                <div class="prix bg-black rounded-full px-3 py-2 text-white">
                  200 euro
                </div>
              </div>
            </div>
            <div class="info p-5">
              <div class="adress bg-[#27234C]/75 rounded-full px-3 py-2">
                laughTile, nr 487 black Hole street
              </div>
              <div class="info m-2 row-[1/2] col-[1/2] flex justify-between">
                <div class="reset bg-yellow-400 rounded-full px-3 py-2">
                  Hallowen party
                </div>
                <div
                  class="prix bg-green-500 rounded-full px-3 py-2 text-white"
                >
                  25/10/2025
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="content-two"></div>
        <div class="content-tree"></div>
        <div class="content-four"></div>
      </div>
    </main>
  </body>
</html>
