<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- <link rel="stylesheet" href="src/output.css"> -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link rel="stylesheet" href="index.css" />
    <script src="js/index.js" defer></script>

    <title>Ticketly</title>
  </head>

  <body class="bg-[#151932] box-border">
    <main class="py-10 bg-[#151932] px-2 sm:py-15 md:px-11 lg:px-45">
      <div class="main-content">
        <div class="step-section lg:mx-25">
          <div class="step-number text-white text-center text-1xl">
            Step <span>1</span>/4
          </div>
          <div class="steps my-5 px-10 flex justify-between">
            <div class="step rounded-full h-2 w-[23%] bg-red-800"></div>
            <div class="step rounded-full h-2 w-[23%] bg-[#D9D9D9]"></div>
            <div class="step rounded-full h-2 w-[23%] bg-[#D9D9D9]"></div>
            <div class="step rounded-full h-2 w-[23%] bg-[#D9D9D9]"></div>
          </div>
        </div>

        <div class="contents">
          <div id="content-one" class="content-one h-fit">
            <div class="step-name text-3xl text-center text-white bold">
              Choix de l’événement
            </div>
          </div>
          <div class="content-two hidden flex-col items-center">
            <div class="step-name text-3xl text-center text-white bold">
              Sélection des billets
            </div>
            <div
              class="data-card py-10 rounded-2xl my-15 flex flex-col gap-5 items-center justify-center box-border w-[calc(100%-16px)] m-auto h-fit mx-1 bg-black/75"
            >
              <div class="title text-white text-2xl">
                Enter le nomber des billets
              </div>
              <input
                required
                class="bg-[#232944] text-white placeholder-grey-500 px-10 py-5 rounded-2xl focus:outline-1 focus:outline-offset-2 focus:outline-blue-300"
                placeholder="enter the number"
                type="number"
                name="Ncounter"
                id="Ncounter"
              />
            </div>
          </div>
          <div class="content-tree flex flex-col hidden">
            <div class="step-name text-3xl text-center text-white bold">
              Ajout des participants
            </div>
            <div
              class="my-5 lg:mx-25 flex flex-col lg:flex-row lg:items-stretch items-center gap-5"
            >
              <div
                class="inputs p-5 rounded-2xl text-white bg-black/75 h-fit w-[100%]"
              >
                <form id="myForm" class="flex flex-col gap-5">
                  <div class="name flex flex-col">
                    <label for="name">Nom</label>
                    <input
                      class="bg-[#232944] text-white placeholder-grey-500 px-10 py-5 rounded-2xl focus:outline-1 focus:outline-offset-2 focus:outline-blue-300"
                      type="text"
                      name="name"
                      id="name"
                      required
                    />
                  </div>
                  <div class="lastname flex flex-col">
                    <label for="lastname">Prenom</label>
                    <input
                      class="bg-[#232944] text-white placeholder-grey-500 px-10 py-5 rounded-2xl focus:outline-1 focus:outline-offset-2 focus:outline-blue-300"
                      type="text"
                      name="lastname"
                      id="lastname"
                      required
                    />
                  </div>
                  <div class="email flex flex-col">
                    <label for="email">E-mail</label>
                    <input
                      class="bg-[#232944] text-white placeholder-grey-500 px-10 py-5 rounded-2xl focus:outline-1 focus:outline-offset-2 focus:outline-blue-300"
                      type="email"
                      name="email"
                      id="email"
                      required
                    />
                  </div>

                  <div class="mobile flex flex-col">
                    <label for="mobile">Name</label>
                    <input
                      class="bg-[#232944] text-white placeholder-grey-500 px-10 py-5 rounded-2xl focus:outline-1 focus:outline-offset-2 focus:outline-blue-300"
                      type="text"
                      name="mobile"
                      id="mobile"
                      required
                    />
                  </div>
                  <div class="submitBtn flex flex-col">
                    <input
                      class="bg-[#232944] w-fit self-center text-white placeholder-grey-500 px-10 py-5 rounded-2xl"
                      type="submit"
                      value="save"
                    />
                  </div>
                </form>
              </div>
              <div
                class="people p-5 rounded-2xl text-white bg-black/75 w-[100%] flex flex-col gap-5 items-center place-center"
              >
                <div class="nodataele w-[50%] lg:w-[45%] m-auto">
                  <img
                    class="lg:w-[55%] m-auto"
                    src="assets/noimg.png"
                    alt="no participants"
                  />
                  <div class="text-bold text-lg w-fit">No participants</div>
                </div>
              </div>
            </div>
          </div>
          <div class="content-four hidden flex-col lg:flex-row">
            <div class="event mb-5">
              <div class="text-center mb-3 text-2xl text-white">Event</div>
              <!-- <div class="info bg-black/75 rounded-2xl overflow-hidden"></div> -->
            </div>
            <div class="partic-event mb-5">
              <div class="text-center mb-3 text-2xl text-white ">
                Participants
              </div>
              <div class="partic bg-black/75 text-white p-5 rounded-2xl">
                <div>Nom: ${data.name}</div>
                <div>Prenom: ${data.lastName}</div>
                <div>E-mail: ${data.email}</div>
                <div>Telephone: ${data.mobile}</div>
                <hr />
              </div>
            </div>
            <div class="confirmer mb-5">
              <div class="text-center mb-3 text-2xl text-white">Le prix</div>
              <div class="reservation bg-black/75 text-white p-5 rounded-2xl">
                <div class="totalPrix"></div>
                <div class="return"></div>
                <div class="reservation">Confirmer la réservation</div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div
        class="btns w-[calc(100%-16px)] h-fit px-7 py-5 my-5 mx-2 rounded-2xl flex justify-between fixed items-end bottom-0 left-0 bg-black/75"
      >
        <div class="btn-prev bg-white rounded-2xl px-6.5 py-3">Prev</div>
        <div class="btn-next bg-red-500 rounded-2xl px-6.5 py-3">Suivant</div>
      </div>
    </main>
  </body>
</html>
